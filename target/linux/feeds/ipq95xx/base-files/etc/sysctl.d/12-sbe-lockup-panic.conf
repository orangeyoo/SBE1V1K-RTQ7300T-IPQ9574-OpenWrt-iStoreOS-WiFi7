# SBE1V1K: a locked-up CPU must reboot the router, not leave it half dead.
# 2026-11-14 the node hit "Watchdog detected hard LOCKUP on cpu 1"; with
# hardlockup_panic=0 the kernel only logged it, the other CPUs kept the
# qcom watchdog fed, and the unit answered ping but nothing else (SSH,
# Wi-Fi, mesh) for hours until a power cycle. kernel.panic=3 reboots.
kernel.hardlockup_panic=1
kernel.softlockup_panic=1
kernel.panic_on_rcu_stall=1
