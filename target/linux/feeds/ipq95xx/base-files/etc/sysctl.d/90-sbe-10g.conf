# Wiro SBE1V1K (Orangeyoo): conservative endpoint tuning for the 10G LAN.
# NSS/PPE forwarding remains vendor-owned; these knobs only size the
# Linux endpoint stacks for high-throughput local services.
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 131072 16777216
net.ipv4.tcp_wmem=4096 131072 16777216
net.ipv4.tcp_mtu_probing=1
