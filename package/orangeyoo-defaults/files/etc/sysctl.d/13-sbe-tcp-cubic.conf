# SBE1V1K: CUBIC as the default TCP congestion control (kernel and OEM
# default). kmod-tcp-bbr's 12-tcp-bbr.conf switches it to BBR, which cut
# Wi-Fi TCP the router terminates itself (proxies, iperf3, file sharing)
# to about a third: 6G 0.4 -> 1.6 Gbit/s down, 0.6 -> 2.3 Gbit/s up on the
# unit (2026-11-13). BBR stays loaded and selectable per socket.
net.ipv4.tcp_congestion_control=cubic
