# wpa-wired-reference.conf - reference wpa_supplicant configuration for
# wired IEEE 802.1X port authentication (MACsec capable build).
#
# The 802.1x-client helper copies this file to /var/run/8021x-<ifname>.conf
# and appends ctrl_interface settings. Deployment should replace the network
# block below with the credentials configured for the local port.
#
# EAP identity/password example (EAP-PEAP/MSCHAPv2, most common enterprise
# default):
ctrl_interface=/var/run/wpa_supplicant

network={
	ssid="wired-8021x"
	key_mgmt=WPA-EAP
	eap=PEAP
	identity="user@example.com"
	password="changeme"
	phase1="peaplabel=0"
	phase2="auth=MSCHAPV2"
}

